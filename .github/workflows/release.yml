name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish panel
        run: >
          dotnet publish TweaksLabPanel/TweaksLabPanel.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Create release zip
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          $version = $tag.TrimStart('v')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/TweaksLabPanel-v$version-win-x64.zip"
          Compress-Archive -Path "TweaksLabPanel/bin/Release/net8.0-windows/win-x64/publish/*" -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
